<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Thread — your routine, remembered</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1E4640">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFF1E9;
    --card: #FFFFFE;
    --ink: #202320;
    --ink-soft: #6B7268;
    --pine: #1E4640;
    --pine-dark: #163530;
    --pine-soft: #E4ECE9;
    --amber: #E3A33D;
    --amber-soft: #FBEBD2;
    --line: #E6E4DA;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(32,35,32,0.04), 0 8px 24px -12px rgba(32,35,32,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    font-family:'Work Sans', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .appbar{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--pine);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 18px;
    display:flex;
    align-items:center;
    gap: 12px;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 6px 20px -8px rgba(30,70,64,0.5);
  }
  .appbar .mark{
    width: 38px; height: 38px;
    border-radius: 11px;
    background: var(--pine-dark);
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
  }
  .appbar .mark svg{ width:20px; height:20px; }
  .appbar .titles h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.28rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .appbar .titles p{
    margin: 1px 0 0;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.72);
  }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  .card-title svg{ width:14px; height:14px; opacity:0.75; }

  textarea{
    width:100%;
    min-height: 88px;
    resize: vertical;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #FBFBF8;
    line-height:1.5;
  }
  textarea:focus{
    outline: none;
    border-color: var(--pine);
    background: #fff;
  }
  .example{
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 8px;
    line-height: 1.4;
  }
  .row{
    display:flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button{
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.1s ease, box-shadow 0.15s ease;
    display:inline-flex;
    align-items:center;
    gap: 7px;
  }
  button svg{ width:15px; height:15px; }
  button:active{ transform: scale(0.96); }
  .btn-primary{
    background: var(--pine);
    color: #fff;
    box-shadow: 0 6px 14px -6px rgba(30,70,64,0.55);
  }
  .btn-secondary{
    background: var(--pine-soft);
    color: var(--pine);
  }
  .btn-primary:disabled{
    opacity: 0.5;
    cursor: default;
    box-shadow: none;
  }
  .status-line{
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 12px;
    min-height: 18px;
  }
  .status-line.ok{ color: var(--pine); font-weight: 500; }

  .schedule-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .schedule-head h2{
    font-family:'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    margin:0;
  }
  .schedule-head .pill{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--pine);
    background: var(--pine-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .empty{
    color: var(--ink-soft);
    font-size: 0.9rem;
    padding: 18px 4px;
    text-align: center;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
  }
  .timeline{
    list-style:none;
    margin:0;
    padding:0;
  }
  .timeline li{
    display:flex;
    align-items:flex-start;
    gap: 13px;
    padding: 12px 4px;
    border-radius: 12px;
    transition: background 0.12s ease;
  }
  .timeline li:not(:last-child){
    border-bottom: 1px solid var(--line);
  }
  .time-chip{
    flex: 0 0 auto;
    min-width: 72px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--pine);
    background: var(--pine-soft);
    border-radius: 8px;
    padding: 6px 9px;
    text-align:center;
    height: fit-content;
  }
  .time-chip.repeat{
    color: #8A5E12;
    background: var(--amber-soft);
  }
  .task-text{
    font-size: 0.95rem;
    padding-top: 4px;
    flex: 1;
    line-height: 1.35;
  }
  .remove-btn{
    margin-left:auto;
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 0.7rem;
    cursor:pointer;
    padding: 6px;
    border-radius: 8px;
    align-self:flex-start;
    opacity: 0.6;
  }
  .remove-btn:hover{ color: #B14A4A; opacity: 1; background: #FBEAEA; }

  footer{
    text-align:center;
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-top: 4px;
    padding: 0 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="7" stroke="#E3A33D" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.2" fill="#E3A33D"/>
    </svg>
  </div>
  <div class="titles">
    <h1>Daily Thread</h1>
    <p id="date-label">Today</p>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      WHAT'S ON TODAY
    </div>
    <textarea id="routine-input" placeholder="gym at 6pm, drink water every 2 hours, study from 4-6pm"></textarea>
    <div class="example">
      Try times like "9am", "6:30pm", a range like "4-6pm", or "every 2 hours".
      <button id="mic-btn" type="button" style="margin-top:8px; padding:6px 14px; font-size:0.8rem;" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        Speak instead
      </button>
    </div>
    <div class="row">
      <button class="btn-primary" id="save-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        Save routine
      </button>
      <button class="btn-secondary" id="notif-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        Reminders
      </button>
    </div>
    <div class="status-line" id="status-line"></div>
  </div>

  <div class="card">
    <div class="schedule-head">
      <h2>Today's schedule</h2>
      <span class="pill" id="count-label"></span>
    </div>
    <div id="schedule-body">
      <div class="empty">Nothing saved yet — add your day above.</div>
    </div>
  </div>

  <footer>Once reminders are on, notifications work even if the app is closed.</footer>
</div>

<script>
const STORAGE_KEY = 'daily-thread-routine';
let items = [];

const inputEl = document.getElementById('routine-input');
const saveBtn = document.getElementById('save-btn');
const notifBtn = document.getElementById('notif-btn');
const statusLine = document.getElementById('status-line');
const scheduleBody = document.getElementById('schedule-body');
const countLabel = document.getElementById('count-label');

function to24Hour(hourStr, minStr, meridiem){
  let h = parseInt(hourStr, 10);
  let m = minStr ? parseInt(minStr, 10) : 0;
  if(meridiem){
    meridiem = meridiem.toLowerCase();
    if(meridiem === 'pm' && h !== 12) h += 12;
    if(meridiem === 'am' && h === 12) h = 0;
  }
  return { h, m };
}

function formatTime(h, m){
  const period = h >= 12 ? 'PM' : 'AM';
  let displayH = h % 12;
  if(displayH === 0) displayH = 12;
  return displayH + (m ? ':' + String(m).padStart(2,'0') : '') + period.toLowerCase();
}

function nextFireAtFor(hour, minute){
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
  if(target.getTime() <= now.getTime()){
    target.setDate(target.getDate() + 1);
  }
  return target.getTime();
}

// Parses one clause of the routine text into a structured reminder
function parseClause(text){
  const raw = text.trim();
  if(!raw) return null;

  // "every N hours/minutes"
  let everyMatch = raw.match(/every\s+(\d+)\s*(hour|hr|minute|min)/i);
  if(everyMatch){
    const n = parseInt(everyMatch[1], 10);
    const unit = everyMatch[2].toLowerCase().startsWith('h') ? 'hours' : 'minutes';
    const label = raw.replace(everyMatch[0], '').replace(/^[\s,.-]+|[\s,.-]+$/g, '') || 'Reminder';
    return {
      type: 'repeat',
      label: capitalize(label),
      everyMs: unit === 'hours' ? n * 60 * 60 * 1000 : n * 60 * 1000,
      displayTime: 'every ' + n + ' ' + unit
    };
  }

  // range like "4-6pm" or "4pm-6pm"
  let rangeMatch = raw.match(/(\d{1,2})(:\d{2})?\s*(am|pm)?\s*-\s*(\d{1,2})(:\d{2})?\s*(am|pm)/i);
  if(rangeMatch){
    const startH = rangeMatch[1], startM = rangeMatch[2] ? rangeMatch[2].slice(1) : null;
    const endMeridiem = rangeMatch[6];
    const startMeridiem = rangeMatch[3] || endMeridiem;
    const start = to24Hour(startH, startM, startMeridiem);
    const label = raw.replace(rangeMatch[0], '').replace(/^(at|from)\s+/i,'').replace(/^[\s,.-]+|[\s,.-]+$/g, '') || 'Reminder';
    return {
      type: 'once',
      label: capitalize(label),
      hour: start.h,
      minute: start.m,
      fireAt: nextFireAtFor(start.h, start.m),
      displayTime: formatTime(start.h, start.m)
    };
  }

  // single time like "6pm", "9:00am", "at 6pm"
  let timeMatch = raw.match(/(\d{1,2})(:\d{2})?\s*(am|pm)/i);
  if(timeMatch){
    const h = timeMatch[1], m = timeMatch[2] ? timeMatch[2].slice(1) : null, mer = timeMatch[3];
    const t = to24Hour(h, m, mer);
    const label = raw.replace(timeMatch[0], '').replace(/^(at)\s+/i,'').replace(/^[\s,.-]+|[\s,.-]+$/g, '') || 'Reminder';
    return {
      type: 'once',
      label: capitalize(label),
      hour: t.h,
      minute: t.m,
      fireAt: nextFireAtFor(t.h, t.m),
      displayTime: formatTime(t.h, t.m)
    };
  }

  // no time found — keep as an untimed note
  return {
    type: 'note',
    label: capitalize(raw),
    displayTime: '—'
  };
}

function capitalize(s){
  s = s.trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function splitRoutine(text){
  return text
    .split(/,|\band\b/i)
    .map(s => s.trim())
    .filter(Boolean);
}

function sortItems(list){
  return list.slice().sort((a, b) => {
    const rank = t => t.type === 'once' ? 0 : t.type === 'repeat' ? 1 : 2;
    if(rank(a) !== rank(b)) return rank(a) - rank(b);
    if(a.type === 'once' && b.type === 'once'){
      return (a.hour * 60 + a.minute) - (b.hour * 60 + b.minute);
    }
    return 0;
  });
}

function renderSchedule(){
  if(!items.length){
    scheduleBody.innerHTML = '<div class="empty">Nothing saved yet — add your day above.</div>';
    countLabel.textContent = '';
    return;
  }
  countLabel.textContent = items.length + (items.length === 1 ? ' item' : ' items');
  const sorted = sortItems(items);
  const html = sorted.map((item) => {
    const chipClass = item.type === 'repeat' ? 'time-chip repeat' : 'time-chip';
    return `<li>
      <span class="${chipClass}">${item.displayTime}</span>
      <span class="task-text">${item.label}</span>
      <button class="remove-btn" data-id="${item.id}">remove</button>
    </li>`;
  }).join('');
  scheduleBody.innerHTML = `<ul class="timeline">${html}</ul>`;

  scheduleBody.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      items = items.filter(i => i.id !== btn.dataset.id);
      persist();
      renderSchedule();
    });
  });
}

async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }catch(e){
    console.error('Could not save routine', e);
  }
  syncSubscription();
}

async function loadSaved(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      items = JSON.parse(raw);
      renderSchedule();
    }
  }catch(e){
    // no saved routine yet — that's fine
  }
}

saveBtn.addEventListener('click', async () => {
  const text = inputEl.value;
  const clauses = splitRoutine(text);
  if(!clauses.length){
    statusLine.textContent = 'Type your routine first — a few things you do today.';
    statusLine.className = 'status-line';
    return;
  }
  const newItems = clauses.map(c => {
    const parsed = parseClause(c);
    parsed.id = 'item-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    return parsed;
  });
  items = items.concat(newItems);
  await persist();
  renderSchedule();
  inputEl.value = '';
  statusLine.textContent = "Saved. " + newItems.length + " item(s) added to today's schedule.";
  statusLine.className = 'status-line ok';
});

const VAPID_PUBLIC_KEY = 'BGa4gERAtvUS0BeMss9sBuidyp-0j3Gxpf2eTwCbTwfmYPKqT5awRG7VuZ4YaSvllwHTSsHgoXLl_tHFHa6jc1E';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; ++i){
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

function prepareItemsForSync(list){
  return list.map((item) => {
    if(item.type === 'once'){
      return { ...item, fireAt: nextFireAtFor(item.hour, item.minute) };
    }
    if(item.type === 'repeat'){
      return { ...item, nextFireAt: Date.now() + item.everyMs };
    }
    return item;
  });
}

async function syncSubscription(){
  try{
    if(!('serviceWorker' in navigator)) return;
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    if(!subscription) return;
    await fetch('/.netlify/functions/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription, reminders: prepareItemsForSync(items) })
    });
  }catch(e){
    console.error('Could not sync reminders to server', e);
  }
}

notifBtn.addEventListener('click', async () => {
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    statusLine.textContent = 'This browser does not support notifications.';
    return;
  }
  const permission = await Notification.requestPermission();
  if(permission !== 'granted'){
    statusLine.textContent = "Notifications are blocked — enable them in your browser's site settings to get alerts.";
    statusLine.className = 'status-line';
    return;
  }
  try{
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if(!subscription){
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await fetch('/.netlify/functions/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription, reminders: prepareItemsForSync(items) })
    });
    statusLine.textContent = 'Reminders are on — you\u2019ll be notified even if the app is closed.';
    statusLine.className = 'status-line ok';
  }catch(e){
    console.error(e);
    statusLine.textContent = 'Could not turn on reminders — check your connection and try again.';
    statusLine.className = 'status-line';
  }
});

setInterval(() => {
  if(items.length) syncSubscription();
}, 5 * 60 * 1000); // keep server copy fresh in case items were removed

const dateLabel = document.getElementById('date-label');
if(dateLabel){
  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

const micBtn = document.getElementById('mic-btn');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(micBtn){
  if(SpeechRecognition){
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    let listening = false;

    micBtn.addEventListener('click', () => {
      if(listening) return;
      listening = true;
      micBtn.textContent = '';
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/></svg> Listening...';
      recognition.start();
    });

    recognition.addEventListener('result', (event) => {
      const transcript = event.results[0][0].transcript;
      inputEl.value = inputEl.value ? inputEl.value + ', ' + transcript : transcript;
    });

    recognition.addEventListener('end', () => {
      listening = false;
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg> Speak instead';
    });

    recognition.addEventListener('error', () => {
      listening = false;
      statusLine.textContent = 'Could not hear you — check microphone permission and try again.';
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg> Speak instead';
    });
  }else{
    micBtn.style.display = 'none';
  }
}

loadSaved();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
  });
}
</script>
</body>
</html>
